name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Бүтээх, туршилт
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: proliance
          POSTGRES_PASSWORD: proliance
          POSTGRES_DB: proliance_lms
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U proliance" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://proliance:proliance@localhost:5432/proliance_lms
      AUTH_SECRET: ci-secret-0123456789abcdef0123456789abcdef
      APP_URL: http://localhost:3000
      ADMIN_PASSWORD: ci-admin-password
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Төрөл шалгах
        run: npx tsc --noEmit -p .
      - name: Өгөгдлийн сан, жишээ өгөгдөл
        run: npm run db:migrate && npm run db:seed && npm run db:migrate
      - run: npm run build
      - name: Сервер асааж шалгах
        run: |
          npx next start -p 3000 > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3000/login && break; sleep 2; done
          curl -sf http://localhost:3000/login | grep -q "Нэвтрэх"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/admin)
          test "$code" = "307" || test "$code" = "302"
          curl -sf -o /dev/null http://localhost:3000/verify/PL-0000-00000
          echo "Сервер зөв ажиллаж байна."
      - if: failure()
        run: cat server.log || true

  docker:
    name: Docker image (ghcr.io)
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image-ийг Postgres-тэй асааж шалгах
        run: |
          docker network create t
          docker run -d --name db --network t -e POSTGRES_USER=proliance -e POSTGRES_PASSWORD=proliance -e POSTGRES_DB=proliance_lms postgres:16-alpine
          docker run -d --name app --network t -p 3000:3000 -e DATABASE_URL=postgresql://proliance:proliance@db:5432/proliance_lms \
            -e AUTH_SECRET=ci-secret-0123456789abcdef0123456789abcdef -e APP_URL=http://localhost:3000 -e SEED_DEMO=1 ghcr.io/${{ github.repository }}:${{ github.sha }}
          for i in $(seq 1 45); do curl -sf -o /dev/null http://localhost:3000/login && break; sleep 2; done
          docker logs app
          curl -sf http://localhost:3000/login | grep -q "Нэвтрэх"
